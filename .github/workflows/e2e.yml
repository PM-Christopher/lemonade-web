name: e2e (manual)

# Runs tooling/e2e's Playwright suite against a real lemonade-backend.
# Needs the LEMONADE_BACKEND_TOKEN, PAYSTACK_SECRET_KEY and PAYSTACK_PUBLIC_KEY repo secrets.
# Demo credentials and fixture ids come from the backend's seeders, so they're plain env vars.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: lemonade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      # SMTP on 1025, REST API on 8025 — signup.spec.ts polls the API for
      # the real OTP email lemonade-backend sends. Same image a local
      # `brew install mailpit` run gives you; no config needed either way.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Check out lemonade-web
        uses: actions/checkout@v7
        with:
          path: lemonade-web

      - name: Check out lemonade-backend
        uses: actions/checkout@v7
        with:
          repository: PM-Christopher/lemonade-backend
          ref: ft_architecture_upgrade
          token: ${{ secrets.LEMONADE_BACKEND_TOKEN }}
          path: lemonade-backend

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, redis
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: lemonade-backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure backend environment
        working-directory: lemonade-backend
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=lemonade#" .env
          sed -i "s#^DB_USERNAME=.*#DB_USERNAME=root#" .env
          sed -i "s#^MAIL_MAILER=.*#MAIL_MAILER=smtp#" .env
          sed -i "s#^MAIL_HOST=.*#MAIL_HOST=127.0.0.1#" .env
          sed -i "s#^MAIL_PORT=.*#MAIL_PORT=1025#" .env
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}" >> .env
          echo "PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}" >> .env
          # Payments and uploads go through the proxy in tooling/e2e/support/paystack-proxy.mjs,
          # which Playwright starts. It forwards to Paystack and stands in for Cloudinary.
          echo "PAYSTACK_PAYMENT_URL=http://127.0.0.1:9801" >> .env
          echo "CLOUDINARY_CLOUD_NAME=e2e" >> .env
          echo "CLOUDINARY_API_KEY=e2e" >> .env
          echo "CLOUDINARY_API_SECRET=e2e" >> .env
          echo "CLOUDINARY_UPLOAD_PREFIX=http://127.0.0.1:9801" >> .env
          echo "ENCRYPTION_KEY=$(openssl rand -hex 16)" >> .env
          # Websockets for chat and payment events. The key must match the frontend's below.
          sed -i "s#^BROADCAST_DRIVER=.*#BROADCAST_DRIVER=reverb#" .env
          sed -i "s#^REVERB_APP_ID=.*#REVERB_APP_ID=e2e#" .env
          sed -i "s#^REVERB_APP_KEY=.*#REVERB_APP_KEY=e2e-key#" .env
          sed -i "s#^REVERB_APP_SECRET=.*#REVERB_APP_SECRET=e2e-secret#" .env
          sed -i "s#^REVERB_HOST=.*#REVERB_HOST=127.0.0.1#" .env

      - name: Migrate and seed deterministic e2e fixtures
        working-directory: lemonade-backend
        run: |
          php artisan migrate --force
          php artisan db:seed --class="Database\Seeders\ReferenceSeeder" --force
          php artisan db:seed --class="Database\Seeders\LocalDemoSeeder" --force
          # Bulk users, tribes, events and businesses so pagination and detail specs have real rows.
          php artisan db:seed --class="Database\Seeders\StagingStressDataSeeder" --force

      - name: Give a second user a known password (connect-messaging.spec.ts)
        working-directory: lemonade-backend
        run: |
          php artisan tinker --execute='$u = App\Models\User::query()->where("email", "!=", "user@lemonade.com")->whereNotNull("username")->whereNotNull("email_verified_at")->whereHas("wallet")->first(); $u->password = Illuminate\Support\Facades\Hash::make("Admin12345#"); $u->save(); file_put_contents(getenv("GITHUB_ENV"), "E2E_USER_TWO_EMAIL=".$u->email."\n", FILE_APPEND);'

      - name: Start backend
        working-directory: lemonade-backend
        run: |
          php artisan serve --host=127.0.0.1 --port=9800 &
          php artisan reverb:start --host=127.0.0.1 --port=8080 &
          php artisan queue:work --tries=1 &
          npx --yes wait-on http://127.0.0.1:9800/health --timeout 30000

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lemonade-web/pnpm-lock.yaml

      - name: Install lemonade-web dependencies
        working-directory: lemonade-web
        run: pnpm install --frozen-lockfile

      - name: Set up .env.local for both apps (points at the backend above)
        working-directory: lemonade-web
        run: |
          cat > apps/frontend/.env.local <<'ENV'
          LARAVEL_API_URL=http://127.0.0.1:9800
          NEXT_PUBLIC_REVERB_KEY=e2e-key
          NEXT_PUBLIC_REVERB_HOST=127.0.0.1
          NEXT_PUBLIC_REVERB_PORT=8080
          NEXT_PUBLIC_REVERB_SCHEME=http
          ENV
          echo "LARAVEL_API_URL=http://127.0.0.1:9800" > apps/admin/.env.local

      - name: Install Playwright
        working-directory: lemonade-web/tooling/e2e
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e suite
        working-directory: lemonade-web/tooling/e2e
        # Seeded demo values, matching tooling/e2e/.env.e2e.example.
        env:
          CI: true
          E2E_USER_EMAIL: user@lemonade.com
          E2E_USER_PASSWORD: Admin12345#
          E2E_ADMIN_EMAIL: admin@lemonade.com
          E2E_ADMIN_PASSWORD: Admin12345#
          E2E_RESTRICTED_ADMIN_EMAIL: e2e-restricted-admin@lemonade.com
          E2E_RESTRICTED_ADMIN_PASSWORD: Admin12345#
          E2E_PAID_EVENT_ID: 00000000-0000-7000-8000-e2e000000001
          E2E_MAILPIT_URL: http://127.0.0.1:8025
          E2E_USER_TWO_PASSWORD: Admin12345#
          E2E_PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          E2E_BACKEND_URL: http://127.0.0.1:9800
        run: pnpm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: lemonade-web/tooling/e2e/playwright-report/
          retention-days: 14
