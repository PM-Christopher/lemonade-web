name: CI

# Mirrors the shape of lemonade-backend's `composer test:ci` gate, and the
# pipeline documented in docs/ARCHITECTURE.md §19. Contract-drift, audit,
# bundle-budget and e2e jobs are TODOs — they depend on pieces that don't
# exist yet (packages/api-types generation, apps/* actually containing code).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=...[origin/main]

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=...[origin/main]

      - name: Test
        run: pnpm turbo run test --filter=...[origin/main]

      - name: Build
        run: pnpm turbo run build --filter=...[origin/main]

  # TODO(Phase 2): regenerate @lemonade/api-types from the backend contract
  # and fail if the committed output differs. See docs/ARCHITECTURE.md §19.
