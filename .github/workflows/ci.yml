name: CI

# Lint, typecheck, test and build for the workspaces a change touches. e2e runs in e2e.yml.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Placeholder URLs so env validation passes during `next build`. Also listed in turbo.json's `build` env.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      # What "affected" is measured against: the PR base, or the commit before a push to main.
      AFFECTED_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
    steps:
      # Full history, so the affected base commit resolves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=...[$AFFECTED_BASE]

      # Fails if either app's `any` count grew. Runs for both apps every time.
      - name: Any-type budget
        run: |
          (cd apps/frontend && pnpm run lint:any-budget)
          (cd apps/admin && pnpm run lint:any-budget)

      # Fails when a workspace lists a dependency it never imports, or imports one it doesn't list.
      - name: Unused dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=...[$AFFECTED_BASE]

      # e2e needs a live backend, so it runs in e2e.yml instead.
      - name: Test
        run: pnpm turbo run test --filter=...[$AFFECTED_BASE] --filter='!@lemonade/e2e'

      - name: Build
        run: pnpm turbo run build --filter=...[$AFFECTED_BASE]

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Regenerates packages/api-types/src/generated/* from the committed
      # manifest.snapshot.json (no PHP or a live backend checkout needed —
      # see tooling/generate-api-types/README.md for what this does and
      # doesn't catch) and fails if that's not what's already committed.
      # Catches "hand-edited a generated file" and "changed the snapshot
      # without re-running the generator" — not drift against the live
      # backend, which needs lemonade-backend checked out in this repo's CI.
      - name: Regenerate api-types from the committed snapshot
        run: pnpm --filter @lemonade/generate-api-types generate:from-snapshot

      - name: Fail if generated output differs from what's committed
        run: git diff --exit-code -- packages/api-types/src/generated

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Critical advisories block the PR; high and below are reported for Dependabot to burn down.
      - name: Audit (blocks on critical)
        run: pnpm audit --audit-level=critical

      - name: Audit (report high)
        run: pnpm audit --audit-level=high || true

  # Fails on First Load JS regression vs. the PR's base branch — never on an
  # absolute number for a route that already existed, so the ratchet only
  # turns one way (see docs/ARCHITECTURE.md §15 and
  # tooling/bundle-budget/README.md). PR-only: a push to main has no base
  # branch of its own to diff against.
  bundle-budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Same reason as the `build` job above: apps/*/src/lib/env.server.ts and
    # env.client.ts throw at build time if these are missing. This job calls
    # `next build` directly (not through turbo), so turbo.json's env
    # allowlist doesn't apply here — but the Zod validation inside the app
    # still runs either way.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (PR branch)
        run: pnpm install --frozen-lockfile

      - name: Build PR branch and snapshot bundle sizes
        run: |
          pnpm --filter lemonade-app build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/current-frontend.json
          pnpm --filter lemonade-admin build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/current-admin.json

      - name: Check out base branch into a separate worktree
        run: git worktree add /tmp/base-branch ${{ github.event.pull_request.base.sha }}

      - name: Install (base branch)
        working-directory: /tmp/base-branch
        run: pnpm install --frozen-lockfile

      - name: Build base branch and snapshot bundle sizes
        working-directory: /tmp/base-branch
        run: |
          pnpm --filter lemonade-app build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/base-frontend.json
          pnpm --filter lemonade-admin build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/base-admin.json

      - name: Compare frontend
        run: node tooling/bundle-budget/compare.mjs --base /tmp/base-frontend.json --current /tmp/current-frontend.json --app frontend

      - name: Compare admin
        run: node tooling/bundle-budget/compare.mjs --base /tmp/base-admin.json --current /tmp/current-admin.json --app admin

  # Report-only (warn, not error) — see tooling/lighthouse-ci/README.md for
  # why: this is the first time these pages have had Lighthouse run in CI,
  # and it only covers the pages that are actually public today (the
  # pre-login auth flow). Both are real limits, not placeholders — the
  # doc's own §15 LCP/CLS targets were written for public event/tribe/
  # business pages that don't exist as public pages yet (see Phase 6's
  # status: that's a deferred product decision, not a frontend gap).
  lighthouse:
    runs-on: ubuntu-latest
    # Same reason as bundle-budget above: this job also calls `next build`
    # directly, outside turbo, so it needs its own copy of these.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter lemonade-app build

      - name: Lighthouse CI (frontend)
        run: pnpm --filter @lemonade/lighthouse-ci frontend

      - name: Build admin
        run: pnpm --filter lemonade-admin build

      - name: Lighthouse CI (admin)
        run: pnpm --filter @lemonade/lighthouse-ci admin

  # Report-only, like Lighthouse above — see tooling/contrast-audit/README.md.
  # Checks the shared shadcn token pairs against WCAG AA; two known failures
  # (destructive-foreground on destructive, border/input on background) are
  # a real design decision, not something CI should silently block on.
  contrast-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contrast audit
        run: pnpm --filter @lemonade/contrast-audit check

  # TODO(Phase 8): Playwright, the ten journeys from docs/ARCHITECTURE.md §17,
  # merge queue only.
  # e2e:
