name: CI

# Mirrors the shape of lemonade-backend's `composer test:ci` gate, and the
# pipeline documented in docs/ARCHITECTURE.md §19. e2e is still a TODO — it
# depends on a Playwright setup that doesn't exist yet.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Required by apps/*/src/lib/env.server.ts and env.client.ts (zod,
    # throws at import time if missing) — `next build` collects page data
    # for every Route Handler, which imports that validation module chain
    # even though no real backend is ever called during a build. The
    # values themselves don't matter (nothing here talks to them), only
    # that they parse as valid URLs. Also declared in turbo.json's `build`
    # task `env` allowlist — Turbo's strict env mode strips anything not
    # listed there even when it's genuinely set here.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      # fetch-depth: 0, not the default shallow clone — every `--filter=...
      # [origin/main]` below needs `origin/main` to actually resolve as a
      # git ref. The default fetch-depth of 1 only fetches the triggering
      # commit itself, so `git rev-parse origin/main` fails with "ambiguous
      # argument 'origin/main': unknown revision" the moment this job runs
      # against a push (there's no PR base ref to piggyback on either).
      # bundle-budget below already does this for its own, different reason
      # (a worktree checkout of the PR base SHA).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=...[origin/main]

      # Declining budget on @typescript-eslint/no-explicit-any (that rule is
      # "warn" at the app layer, not "error" — see apps/*/eslint.config.mjs
      # and docs/ARCHITECTURE.md Phase 3) — fails if either app's count grew.
      # Not filtered by --filter=...[origin/main]: it's cheap enough to just
      # always run both, and a change in one app can't silently exempt it.
      - name: Any-type budget
        run: |
          (cd apps/frontend && pnpm run lint:any-budget)
          (cd apps/admin && pnpm run lint:any-budget)

      # Same ratchet, for local/no-hardcoded-pixel-class ("warn" at the app
      # layer — see apps/*/eslint.config.mjs and docs/ARCHITECTURE.md
      # Phase 7): fails if either app's hardcoded `[Npx]` class count grew.
      - name: Pixel-class budget
        run: |
          (cd apps/frontend && pnpm run lint:pixel-budget)
          (cd apps/admin && pnpm run lint:pixel-budget)

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=...[origin/main]

      # Excludes @lemonade/e2e deliberately — its `test` script is a real
      # Playwright run against a live lemonade-backend (MySQL, Mailpit,
      # `php artisan serve`), infrastructure only .github/workflows/e2e.yml
      # sets up. Without this exclusion, turbo's `...[origin/main]` scope
      # picks it up whenever any e2e spec file is part of the diff (true
      # for this push) and this job — which has none of that — fails
      # trying to run it. Confirmed via `turbo run test --filter=...
      # [origin/main] --dry-run=json` before adding this.
      - name: Test
        run: pnpm turbo run test --filter=...[origin/main] --filter='!@lemonade/e2e'

      - name: Build
        run: pnpm turbo run build --filter=...[origin/main]

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Regenerates packages/api-types/src/generated/* from the committed
      # manifest.snapshot.json (no PHP or a live backend checkout needed —
      # see tooling/generate-api-types/README.md for what this does and
      # doesn't catch) and fails if that's not what's already committed.
      # Catches "hand-edited a generated file" and "changed the snapshot
      # without re-running the generator" — not drift against the live
      # backend, which needs lemonade-backend checked out in this repo's CI.
      - name: Regenerate api-types from the committed snapshot
        run: pnpm --filter @lemonade/generate-api-types generate:from-snapshot

      - name: Fail if generated output differs from what's committed
        run: git diff --exit-code -- packages/api-types/src/generated

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Non-blocking for now: 74 pre-existing advisories (6 critical, 32
      # high), almost all in transitive deps of antd/draft-js/sharp — making
      # this a hard gate today would fail every PR on debt it didn't
      # introduce. Dependabot (.github/dependabot.yml) is what actually
      # burns this down over time; this job's job is to keep the count
      # visible in every PR, not to block on it yet. Flip to blocking once
      # the count is near zero.
      - name: Audit (report only)
        run: pnpm audit --audit-level=high || true

  # Fails on First Load JS regression vs. the PR's base branch — never on an
  # absolute number for a route that already existed, so the ratchet only
  # turns one way (see docs/ARCHITECTURE.md §15 and
  # tooling/bundle-budget/README.md). PR-only: a push to main has no base
  # branch of its own to diff against.
  bundle-budget:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Same reason as the `build` job above: apps/*/src/lib/env.server.ts and
    # env.client.ts throw at build time if these are missing. This job calls
    # `next build` directly (not through turbo), so turbo.json's env
    # allowlist doesn't apply here — but the Zod validation inside the app
    # still runs either way.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install (PR branch)
        run: pnpm install --frozen-lockfile

      - name: Build PR branch and snapshot bundle sizes
        run: |
          pnpm --filter lemonade-app build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/current-frontend.json
          pnpm --filter lemonade-admin build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/current-admin.json

      - name: Check out base branch into a separate worktree
        run: git worktree add /tmp/base-branch ${{ github.event.pull_request.base.sha }}

      - name: Install (base branch)
        working-directory: /tmp/base-branch
        run: pnpm install --frozen-lockfile

      - name: Build base branch and snapshot bundle sizes
        working-directory: /tmp/base-branch
        run: |
          pnpm --filter lemonade-app build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/base-frontend.json
          pnpm --filter lemonade-admin build | node tooling/bundle-budget/parse-build-output.mjs > /tmp/base-admin.json

      - name: Compare frontend
        run: node tooling/bundle-budget/compare.mjs --base /tmp/base-frontend.json --current /tmp/current-frontend.json --app frontend

      - name: Compare admin
        run: node tooling/bundle-budget/compare.mjs --base /tmp/base-admin.json --current /tmp/current-admin.json --app admin

  # Report-only (warn, not error) — see tooling/lighthouse-ci/README.md for
  # why: this is the first time these pages have had Lighthouse run in CI,
  # and it only covers the pages that are actually public today (the
  # pre-login auth flow). Both are real limits, not placeholders — the
  # doc's own §15 LCP/CLS targets were written for public event/tribe/
  # business pages that don't exist as public pages yet (see Phase 6's
  # status: that's a deferred product decision, not a frontend gap).
  lighthouse:
    runs-on: ubuntu-latest
    # Same reason as bundle-budget above: this job also calls `next build`
    # directly, outside turbo, so it needs its own copy of these.
    env:
      LARAVEL_API_URL: http://127.0.0.1:9800
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter lemonade-app build

      - name: Lighthouse CI (frontend)
        run: pnpm --filter @lemonade/lighthouse-ci frontend

      - name: Build admin
        run: pnpm --filter lemonade-admin build

      - name: Lighthouse CI (admin)
        run: pnpm --filter @lemonade/lighthouse-ci admin

  # Report-only, like Lighthouse above — see tooling/contrast-audit/README.md.
  # Checks the shared shadcn token pairs against WCAG AA; two known failures
  # (destructive-foreground on destructive, border/input on background) are
  # a real design decision, not something CI should silently block on.
  contrast-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contrast audit
        run: pnpm --filter @lemonade/contrast-audit check

  # TODO(Phase 8): Playwright, the ten journeys from docs/ARCHITECTURE.md §17,
  # merge queue only.
  # e2e:
