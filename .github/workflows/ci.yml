name: CI

# Mirrors the shape of lemonade-backend's `composer test:ci` gate, and the
# pipeline documented in docs/ARCHITECTURE.md §19. bundle-budget and e2e
# jobs are still TODOs — they depend on pieces that don't exist yet (apps/*
# actually containing code, a Playwright setup).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=...[origin/main]

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=...[origin/main]

      - name: Test
        run: pnpm turbo run test --filter=...[origin/main]

      - name: Build
        run: pnpm turbo run build --filter=...[origin/main]

  contract-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Regenerates packages/api-types/src/generated/* from the committed
      # manifest.snapshot.json (no PHP or a live backend checkout needed —
      # see tooling/generate-api-types/README.md for what this does and
      # doesn't catch) and fails if that's not what's already committed.
      # Catches "hand-edited a generated file" and "changed the snapshot
      # without re-running the generator" — not drift against the live
      # backend, which needs lemonade-backend checked out in this repo's CI.
      - name: Regenerate api-types from the committed snapshot
        run: pnpm --filter @lemonade/generate-api-types generate:from-snapshot

      - name: Fail if generated output differs from what's committed
        run: git diff --exit-code -- packages/api-types/src/generated

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Non-blocking for now: 74 pre-existing advisories (6 critical, 32
      # high), almost all in transitive deps of antd/draft-js/sharp — making
      # this a hard gate today would fail every PR on debt it didn't
      # introduce. Dependabot (.github/dependabot.yml) is what actually
      # burns this down over time; this job's job is to keep the count
      # visible in every PR, not to block on it yet. Flip to blocking once
      # the count is near zero.
      - name: Audit (report only)
        run: pnpm audit --audit-level=high || true

  # TODO(Phase 6): fail on bundle-size regression vs. base branch.
  # bundle-budget:

  # TODO(Phase 8): Playwright, the ten journeys from docs/ARCHITECTURE.md §17,
  # merge queue only.
  # e2e:
